name: secret-scan

# Miautrix secret scanning — MIA-22
#
# The enforcement boundary. The pre-commit hook is a courtesy that a developer can
# bypass with --no-verify or by never running install-hooks.sh; this job cannot be
# bypassed. Both call the same scripts/secret-scan.sh, so they agree by
# construction rather than by convention.
#
# FAILURE-CLOSED throughout: no `continue-on-error`, no `|| true`, and the
# download step verifies a checksum, so a corrupted or substituted binary fails
# the build instead of quietly scanning nothing.

on:
  push:
    branches: ['**']
  pull_request:
  # Manual re-run, e.g. after editing the allowlist.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the Windows leg because Linux failed, or vice versa — when
      # something is platform-specific we want to see both results at once.
      fail-fast: false
      matrix:
        # Windows is a first-class Miautrix target, so the scanner is exercised
        # there on every run rather than assumed to work. This is what turns
        # "should be portable" into evidence.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        # Git for Windows' bash, identical to the shell git uses for hooks there.
        shell: bash

    env:
      # Pin the version. An unpinned "latest" means the build's verdict can change
      # without a commit, which is the opposite of reproducible.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256_LINUX: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_SHA256_WINDOWS: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default shallow checkout would scan only the tip and
          # report a clean build over a repo with a secret three commits back.
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p .gitleaks-bin
          cd .gitleaks-bin

          case "${{ runner.os }}" in
            Linux)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
              expected="$GITLEAKS_SHA256_LINUX"
              ;;
            Windows)
              asset="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
              expected="$GITLEAKS_SHA256_WINDOWS"
              ;;
            *)
              echo "unsupported runner OS: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac

          curl --fail --silent --show-error --location --retry 3 \
            -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"

          # Verify before executing. Without this the pin is cosmetic: a
          # compromised or truncated download would run as our scanner.
          echo "${expected}  ${asset}" | sha256sum --check --strict

          case "$asset" in
            *.tar.gz) tar -xzf "$asset" gitleaks ;;
            *.zip)    unzip -o -q "$asset" gitleaks.exe ;;
          esac
          rm -f "$asset"
          chmod +x gitleaks* 2>/dev/null || true

          # Prove the binary actually runs before we depend on its verdict.
          ./gitleaks* version

      - name: Scan full history
        # secret-scan.sh finds .gitleaks-bin/gitleaks itself, so the hook and CI
        # resolve the binary the same way.
        run: ./scripts/secret-scan.sh history

      - name: Scan working tree
        # History scanning walks commits; this catches a secret in an untracked-in-
        # history path or a file only present at the tip, and is the same check a
        # developer runs locally.
        run: ./scripts/secret-scan.sh worktree

      - name: Prove the scanner still catches a real secret
        # A scanner with an over-broad allowlist passes everything and looks
        # perfectly healthy. This plants a synthetic-but-detectable credential in a
        # throwaway directory and asserts the scanner FAILS on it, so an allowlist
        # widened into uselessness breaks the build instead of hiding behind a
        # green tick.
        #
        # The token is assembled from fragments at runtime so this workflow file
        # does not itself contain a matchable secret — otherwise the canary would
        # trip the scan of our own repo. Verified locally: the generated file is
        # detected (exit 2) while this script is not (exit 0).
        run: |
          set -uo pipefail
          canary_dir="$(mktemp -d)"
          prefix="gh"
          mid="p_"
          body="1234567890abcdefghijklmnopqrstuvwxyzAB"
          printf 'token = "%s%s%s"\n' "$prefix" "$mid" "$body" > "$canary_dir/canary.txt"

          set +e
          ./.gitleaks-bin/gitleaks* detect --no-git --source "$canary_dir" \
            --config .gitleaks.toml --no-banner --redact --exit-code 2 \
            --log-level error
          status=$?
          set -e
          rm -rf "$canary_dir"

          if [ "$status" -ne 2 ]; then
            echo "::error::Canary NOT detected (exit $status). The ruleset or allowlist is broken — this scanner is not protecting the repo." >&2
            exit 1
          fi
          echo "Canary detected as expected; the scanner is live."
